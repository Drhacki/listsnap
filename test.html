<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListSnap Tests</title>
  <style>
    :root { --bg: #fff; --text: #111; --ok: #1f7a4d; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121614; --text: #e6ece9; --ok: #3fb07a; --bad: #f2b8b5; } }
    :root[data-theme="dark"] { --bg: #121614; --text: #e6ece9; --ok: #3fb07a; --bad: #f2b8b5; }
    body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 700; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>ListSnap self-test</h1>
  <p>Checks the list parser, the Excel append logic, and real OCR on the images in <code>samples/</code>.</p>
  <div id="log"></div>
  <pre id="out"></pre>
  <script src="load.js"></script>
  <script src="parse.js"></script>
  <script src="ocr.js"></script>
  <script src="ai.js"></script>
  <script src="excel.js"></script>
  <script>
  (async () => {
    const results = [];
    const log = (ok, name, detail) => {
      results.push({ ok, name, detail });
      const p = document.createElement("div");
      p.className = ok ? "ok" : "bad";
      p.textContent = (ok ? "PASS " : "FAIL ") + name + (detail ? " | " + detail : "");
      document.getElementById("log").appendChild(p);
    };
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    // --- parser ---
    const cases = [
      ["Eggs 12", { item: "Eggs", qty: 12, price: "", time: "", made: false }],
      ["Bread loaves   12   $3.50   made", { item: "Bread loaves", qty: 12, price: 3.5, time: "", made: true }],
      ["Muffins x 18 @ 2.00 done", { item: "Muffins", qty: 18, price: 2, time: "", made: true }],
      ["3. Flour 2 kg 4,50 morning", { item: "Flour (kg)", qty: 2, price: 4.5, time: "Morning", made: false }],
      ["- Milk - 4", { item: "Milk", qty: 4, price: "", time: "", made: false }],
      ["Sugar 2 15₪", { item: "Sugar", qty: 2, price: 15, time: "", made: false }],
      ["Oil 1 nis 30", { item: "Oil", qty: 1, price: 30, time: "", made: false }],
      ["Rice 5 20",{ item: "Rice", qty: 5, price: 20, time: "", made: false }],
      ["Cake 1 PM ✓", { item: "Cake", qty: 1, price: "", time: "Afternoon", made: true }],
      ["ዳቦ 12 30 ብር ተሰርቷል", { item: "ዳቦ", qty: 12, price: 30, time: "", made: true }],
      ["ሻይ ቅጠል 2 ኪሎ 150 ብር በጠዋት", { item: "ሻይ ቅጠል (ኪሎ)", qty: 2, price: 150, time: "Morning", made: false }],
      ["ቡና ፲፪ ብር ፪፻፶ ከሰዓት በኋላ", { item: "ቡና", qty: 12, price: 250, time: "Afternoon", made: false }],
      ["ዳቦ 12 3ዐ ብር ዝግጂ", { item: "ዳቦ", qty: 12, price: 30, time: "", made: true }],
      ["ዕቃ ብዛት ዋጋ", null],
      ["Item  Qty  Price", null],
      ["12345", null],
    ];
    const st = { section: "" };
    for (const [line, want] of cases) {
      const got = ListParser.parseLine(line, st);
      log(eq(got, want), `parse "${line}"`, eq(got, want) ? "" : `got ${JSON.stringify(got)}`);
    }
    const sec = ListParser.parseListText("Morning:\nA 1\nB 2\nAFTERNOON\nC 3");
    log(eq(sec.map((r) => r.time), ["Morning", "Morning", "Afternoon"]), "section headers set the time");
    const secAm = ListParser.parseListText("ጠዋት\nዳቦ 1\nከሰዓት በኋላ\nቡና 2");
    log(eq(secAm.map((r) => r.time), ["Morning", "Afternoon"]), "Amharic section headers set the time", JSON.stringify(secAm));

    // --- columns decided by the picture (plain text: 2+ spaces = column gap) ---
    const line = (cells, w = 10) => cells.map((c) => c.padEnd(w)).join("").trimEnd();
    const colsOf = (r) => r.columns.map((c) => `${c.name}:${c.type}`);
    let a = ListParser.analyze([
      line(["Product", "Unit", "Qty", "Price", "Supplier"]),
      line(["Flour", "kg", "25", "$40.00", "Abebe"]),
      line(["Eggs", "tray", "6", "$4.20", "Farm Co"]),
    ].join("\n"));
    log(eq(colsOf(a), ["Product:text", "Unit:text", "Qty:number", "Price:number", "Supplier:text"]), "header row becomes the columns", JSON.stringify(colsOf(a)));
    log(eq(a.rows, [["Flour", "kg", 25, 40, "Abebe"], ["Eggs", "tray", 6, 4.2, "Farm Co"]]), "values land under the right header", JSON.stringify(a.rows));

    a = ListParser.analyze([line(["Item", "Qty", "Done"]), "MORNING", line(["Bread", "12", "✓"]), "AFTERNOON", line(["Cake", "2", "-"])].join("\n"));
    log(eq(colsOf(a), ["Item:text", "Qty:number", "Done:check", "Time:time"]), "section titles add a Time column", JSON.stringify(colsOf(a)));
    log(eq(a.rows, [["Bread", 12, true, "Morning"], ["Cake", 2, false, "Afternoon"]]), "yes/no and time values", JSON.stringify(a.rows));

    a = ListParser.analyze("Eggs 12\nMilk 4");
    log(eq(colsOf(a), ["Item:text", "Qty:number"]), "no header: only the columns the list has", JSON.stringify(colsOf(a)));

    a = ListParser.analyze([line(["ዕቃ", "ብዛት", "ዋጋ", "ደንበኛ"]), line(["ዳቦ", "፲፪", "30 ብር", "ሰላም"])].join("\n"));
    log(eq(colsOf(a), ["ዕቃ:text", "ብዛት:number", "ዋጋ:number", "ደንበኛ:text"]) && eq(a.rows, [["ዳቦ", 12, 30, "ሰላም"]]), "Amharic header row", JSON.stringify(a));

    // --- tables with grid lines (word positions + line positions, no OCR) ---
    const wd = (text, x0, y0, x1, y1) => ({ text, x0, y0, x1, y1 });
    a = ListParser.analyze("", [
      { words: [wd("Item", 10, 5, 50, 15), wd("Qty", 110, 5, 140, 15)] },
      { words: [wd("Fresh", 10, 25, 50, 35)] },
      { words: [wd("bread", 10, 40, 50, 50), wd("12", 110, 40, 125, 50)] },
      { words: [wd("Milk", 10, 65, 50, 75), wd("4", 110, 65, 120, 75)] },
    ], { rows: [20, 58, 85], cols: [100] });
    log(eq(colsOf(a), ["Item:text", "Qty:number"]) && eq(a.rows, [["Fresh bread", 12], ["Milk", 4]]), "grid: text wrapped inside a cell stays one row", JSON.stringify(a));

    a = ListParser.analyze("", [
      { words: [wd("A", 60, 0, 66, 8), wd("B", 160, 0, 166, 8), wd("C", 260, 0, 266, 8)] },
      { words: [wd("1", 5, 15, 10, 25), wd("Task", 60, 15, 90, 25), wd("Owner", 160, 15, 200, 25)] },
      { words: [wd("2", 5, 35, 10, 45), wd("Call", 60, 35, 85, 45), wd("Sam", 160, 35, 185, 45)] },
    ], { rows: [12, 30, 50], cols: [40, 140, 240] });
    log(eq(a.columns.map((c) => c.name), ["Task", "Owner"]) && eq(a.rows, [["Call", "Sam"]]), "grid: spreadsheet letters, row numbers and empty columns are dropped", JSON.stringify(a));

    a = ListParser.analyze("", [
      { words: [wd("No.", 5, 5, 20, 15), wd("Item", 60, 5, 90, 15), wd("Status", 160, 5, 200, 15)] },
      { words: [wd("1", 5, 25, 10, 35), wd("Bread", 60, 25, 95, 35), wd("Done", 160, 25, 190, 35)] },
      { words: [wd("2", 5, 45, 10, 55), wd("Milk", 60, 45, 90, 55), wd("Not", 160, 45, 180, 55), wd("started", 184, 45, 220, 55)] },
    ], { rows: [20, 40, 60], cols: [40, 140] });
    log(eq(a.columns.map((c) => `${c.name}:${c.type}:${c.role}`), ["No:number:qty", "Item:text:item", "Status:text:null"]) && eq(a.rows, [[1, "Bread", "Done"], [2, "Milk", "Not started"]]),
      "grid: a printed No. column is kept, and a Status column of words stays text", JSON.stringify(a));

    // --- equation columns ---
    const eqCols = [
      { id: "a", name: "ጠዋት: ድምር", type: "number" }, { id: "b", name: "የተበላሸ", type: "number" }, { id: "p", name: "Price", type: "number" },
      { id: "s", name: "Status", type: "text" }, { id: "d", name: "Made", type: "check" },
    ];
    const calc = (equation, row, cols = eqCols) => ListParser.equationValue({ equation }, cols, row);
    log(calc("([ጠዋት: ድምር] − [የተበላሸ]) × [Price]", { a: 100, b: 2, p: 10 }).value === 980, "equation: brackets, − and × work");
    log(calc("[ጠዋት: ድምር] - [የተበላሸ] * [Price]", { a: 100, b: 2, p: 10 }).value === 80, "equation: × goes before −");
    log(calc("[Price] * 15% + 1", { p: 200 }).value === 31, "equation: percent and plain numbers");
    log(calc("= -[Price] / 2", { p: 10 }).value === -5, "equation: a leading = and a minus sign");
    log(calc("Price x 2", { p: 10 }).value === 20 && calc("[Price] x 2", { p: 10 }).value === 20 && calc("[Price] x [የተበላሸ]", { p: 10, b: 3 }).value === 30, "equation: a name without [ ] and x for ×");
    log(calc("[ጠዋት: ድምር] + [Price]", { a: 5 }).value === 5, "equation: a blank cell counts as 0, as in Excel");
    log(calc("[Price] × 2", { p: "12" }).value === 24, "equation: a number kept as text still counts");
    log(/isn't a number/.test(calc("[Status] × 2", { s: "Not started" }).error), "equation: words give a clear message", JSON.stringify(calc("[Status] × 2", { s: "Not started" })));
    log(/zero/.test(calc("[Price] ÷ [የተበላሸ]", { p: 5, b: 0 }).error), "equation: dividing by zero gives a clear message");
    const eqBad = (t) => ListParser.validateEquation(t, eqCols, null);
    log(!eqBad("[Nope] + 1").ok && !eqBad("[Price] +").ok && !eqBad("[Price] [Status]").ok && !eqBad("([Price]").ok && !eqBad("").ok && !eqBad("[Made] + 1").ok,
      "equation: mistakes and non-number columns are refused", JSON.stringify(["[Nope] + 1", "[Price] +", "[Price] [Status]", "([Price]", "", "[Made] + 1"].map((t) => eqBad(t).error)));
    log(eqBad("alert(1)").ok === false && eqBad("constructor.constructor('x')()").ok === false, "equation: code can't be run through it");
    log(eqBad("[price]*2").text === "[Price] × 2", "equation: tidied, with the column's real name", eqBad("[price]*2").text);
    {
      const toX = (t) => ListParser.equationToExcel(ListParser.parseEquation(t).tree, (n) => ({ A: "C2", B: "D2", C: "E2" })[n]);
      const pairs = [["([A] − [B]) × [C]", "(C2-D2)*E2"], ["[A] − [B] × [C]", "C2-D2*E2"], ["[A] − ([B] − [C])", "C2-(D2-E2)"], ["[A] ÷ ([B] × [C])", "C2/(D2*E2)"], ["[A] × 15%", "C2*15%"], ["-[A] + 2", "-C2+2"]];
      log(pairs.every(([a, b]) => toX(a) === b), "equation: turned into Excel formulas with the right brackets", JSON.stringify(pairs.map(([a]) => toX(a))));
      const cols = [{ id: "x", name: "Total", type: "calc", equation: "[Y] + 1" }, { id: "y", name: "Y", type: "calc", equation: "[Total] + 1" }];
      log(/own result/.test(ListParser.equationValue(cols[0], cols, {}).error), "equation: columns that go round in a circle give a message, not a hang");
      log(!ListParser.validateEquation("[Total] × 2", cols, cols[1]).ok, "equation: a circle is refused when setting it up");
    }

    // --- price lists: filled in from the item name ---
    {
      const list = ListParser.parsePriceList("ባለ 10 = 10\nዳቦ = 20\nዳቦ ዱቄት 1 ኪሎ = 95 ብር\nብስኩት\t45\nሚኒ ዶናት = 1,200.50\nፒታ =\n\n");
      log(list.ok && list.entries.length === 5 && list.entries[2].price === 95 && list.entries[3].price === 45 && list.entries[4].price === 1200.5 && eq(list.unpriced, ["ፒታ"]),
        "price list: = or a tab, ብር and commas, and names still without a price", JSON.stringify(list));
      log(!ListParser.parsePriceList("ዳቦ = ten").ok && !ListParser.parsePriceList("= 5").ok, "price list: a price that isn't a number is refused");
      const cols = [{ id: "n", name: "ተ.ቁ", type: "number" }, { id: "i", name: "የዳቦ አይነት", type: "text", role: "item" },
        { id: "p", name: "Price", type: "lookup", priceList: "ባለ 1 = 1\nባለ 10 = 10\nዳቦ = 20\nዳቦ ዱቄት 1 ኪሎ = 95\nብስኩት = 45" }];
      const price = (name) => ListParser.lookupValue(cols[2], cols, { i: name });
      log(price("ባለ 10") === 10 && price("ባለ 1") === 1 && price("ዳቦ ዱቄት 1 ኪሎ") === 95 && price("ዳቦ ቆሎ") === 20 && price("ብስኩት 45") === 45 && price("  ብስኩት   45 ") === 45,
        "price list: whole-word start of the name, the longest name wins", JSON.stringify(["ባለ 10", "ባለ 1", "ዳቦ ዱቄት 1 ኪሎ", "ዳቦ ቆሎ", "ብስኩት 45"].map(price)));
      log(price("ፒዛ") === null && price("ዳቦዎች") === null && price("") === null, "price list: no match gives no price (and ዳቦ doesn't catch ዳቦዎች)");
      const withSales = [...cols, { id: "q", name: "ድምር", type: "number" }, { id: "t", name: "Sales", type: "calc", equation: "[ድምር] × [Price]" }];
      log(ListParser.equationValue(withSales[4], withSales, { i: "ባለ 10", q: 7 }).value === 70 && ListParser.equationValue(withSales[4], withSales, { i: "ፒዛ", q: 7 }).value === 0,
        "price list: equations can use it (no price counts as 0)");
    }

    // --- do the numbers add up? ---
    const named = (...names) => names.map((name) => ({ name }));
    let flags = ListParser.checkNumbers(named("ዳቦ", "ጠዋት: ያደረ", "ጠዋት: አዲስ", "ጠዋት: ድምር", "ጠዋት: የተበላሸ"), [
      ["ባለ 10", 5, 95, 100, 2],
      ["ባለ 25", "", 40, 40, 0],
      ["ባለ 30", 10, 20, 35, 1],
      ["ባለ 45", 1, 1, 2, 0],
    ]);
    log(eq(flags, [{ row: 2, col: 3 }, { row: 2, col: 2 }, { row: 2, col: 1 }]), "a row whose parts don't add up to its ድምር is flagged (blank counts as 0)", JSON.stringify(flags));
    flags = ListParser.checkNumbers(named("Item", "Qty", "Price", "Total"), [["A", 2, 5, 10], ["B", 3, 4, 12], ["C", 2, 2, 5]]);
    log(eq(flags.map((f) => f.row), [2, 2, 2]), "Qty × Price = Total is checked too", JSON.stringify(flags));
    flags = ListParser.checkNumbers(named("Item", "Qty", "Price", "Total"), [["A", 2, 5, 99], ["B", 3, 4, 7], ["C", 2, 2, 50]]);
    log(eq(flags, []), "a Total column that follows no rule flags nothing", JSON.stringify(flags));
    flags = ListParser.checkNumbers(named("No", "Morning", "Afternoon", "Total"), [[1, 5, 5, 10], [2, 3, 4, 7], [3, 1, 1, 9]]);
    log(eq(flags.map((f) => f.row), [2, 2, 2]) && !flags.some((f) => f.col === 0), "a No. column isn't counted in the sum", JSON.stringify(flags));

    // --- following an AI's answer as it arrives ---
    log(ListAI.countRows('{"columns":["a","b"],"rows":[["1","x]"],["2"') === 1, "rows are counted while the answer is still arriving");
    log(ListAI.countRows('{"columns":["a"],"rows":[["1"],["2"],["3"]],"unsure":[{"row":1,"column":"a"}]}') === 3, "the count stops at the end of the rows");
    log(ListAI.geminiSchema({ type: "array", items: { type: "object", properties: { a: { type: "integer" } }, required: ["a"], additionalProperties: false } }).items.properties.a.type === "INTEGER", "schemas are converted to Gemini's format");

    // --- Gemini: busy models, used-up allowances and the backup model (stand-in replies, nothing is sent) ---
    {
      const photo = new File([await (await fetch("samples/printed-list.png")).blob()], "p.png", { type: "image/png" });
      const realFetch = window.fetch;
      const LIMITS = "listsnap.geminiLimits";
      const savedLimits = localStorage.getItem(LIMITS);
      localStorage.removeItem(LIMITS);
      const good = () => new Response(new TextEncoder().encode("data: " + JSON.stringify({ candidates: [{ finishReason: "STOP", content: { parts: [{ text: '{"corrections":[]}' }] } }] }) + "\n\n"), { status: 200 });
      const busy = () => new Response(JSON.stringify({ error: { status: "UNAVAILABLE", message: "high demand" } }), { status: 503 });
      const dayLimit = () => new Response(JSON.stringify({ error: { status: "RESOURCE_EXHAUSTED", details: [{ retryDelay: "7037s" }] } }), { status: 429 });
      let calls, answers;
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        if (!url.includes("generativelanguage")) return realFetch(input, init);
        const model = url.match(/models\/([^:]+):/)[1];
        calls.push(model);
        return answers(model, calls.length);
      };
      const ask = async () => {
        const notes = [];
        try { await ListAI.proofread("gemini", photo, "test-key", ["a"], [["1"]], { onNote: (n) => notes.push(n) }); return { ok: true, notes }; }
        catch (e) { return { ok: false, message: e.message, notes }; }
      };
      calls = []; answers = (model, n) => (n === 1 ? busy() : good());
      let r = await ask();
      log(r.ok && eq(calls, ["gemini-3.8-flash", "gemini-3.8-flash"]), "a busy Gemini is tried once more", JSON.stringify({ calls, r }));

      calls = []; answers = (model) => (model === "gemini-3.8-flash" ? busy() : good());
      r = await ask();
      log(r.ok && eq(calls, ["gemini-3.8-flash", "gemini-3.8-flash", "gemini-3.6-flash"]), "if it stays busy, the backup model takes over", JSON.stringify({ calls, r }));

      calls = []; answers = (model) => (model === "gemini-3.8-flash" ? dayLimit() : good());
      r = await ask();
      log(r.ok && eq(calls, ["gemini-3.8-flash", "gemini-3.6-flash"]), "a used-up daily allowance goes straight to the backup model", JSON.stringify({ calls, r }));
      calls = [];
      r = await ask();
      log(r.ok && eq(calls, ["gemini-3.6-flash"]), "and the next photo doesn't waste a request on the used-up model", JSON.stringify({ calls, r }));

      calls = []; answers = () => dayLimit();
      r = await ask();
      log(!r.ok && /used up today's free requests.*about 2 hours/.test(r.message) && eq(calls, ["gemini-3.6-flash"]), "when both are used up, the message says when they come back", JSON.stringify({ calls, r }));

      window.fetch = realFetch;
      if (savedLimits) localStorage.setItem(LIMITS, savedLimits); else localStorage.removeItem(LIMITS);
    }

    // --- closest remembered names, for a misread name ---
    {
      const names = ["ባለ 10", "ባለ 25", "ብስኩት 45", "ቦቦሊኖ 55", "ሚኒ ዶናት 90", "ዶናት 75", "ሳንቡሳ", "ዳቦ ዱቄት 1 ኪሎ", "ዳቦ ቆሎ", "ግሪሲኒ", "ፈጢራ", "ፒታ"];
      // misreads Gemini really made in testing, and the right names
      const real = [["ፒዛ", "ፒታ"], ["ዳናት 75", "ዶናት 75"], ["ሚኒ እናት 90", "ሚኒ ዶናት 90"], ["ብስክሌት 45", "ብስኩት 45"], ["ቦሊሊያ 55", "ቦቦሊኖ 55"], ["ዱቦ ቆሎ", "ዳቦ ቆሎ"], ["ሳንዱሳ", "ሳንቡሳ"], ["ግሬስሊን", "ግሪሲኒ"]];
      const firsts = real.map(([read]) => ListParser.closestNames(read, names, 3)[0]);
      log(eq(firsts, real.map(([, right]) => right)), "closest name: real misreads get the right name first", JSON.stringify(firsts));
      log(ListParser.closestNames("ባለ 7O", names, 3)[0] === "ባለ 10" && ListParser.closestNames("x", [], 3).length === 0 && ListParser.closestNames("ፒታ", names, 2).length === 2,
        "closest name: at most the number asked for, nothing from an empty list");
    }

    // --- remembered names go to the AI (stand-in reply, nothing is sent) ---
    {
      const photo = new File([await (await fetch("samples/printed-list.png")).blob()], "p.png", { type: "image/png" });
      const realFetch = window.fetch;
      let prompt = "";
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        if (!url.includes("generativelanguage")) return realFetch(input, init);
        prompt = JSON.parse(init.body).contents[0].parts[1].text;
        return new Response(new TextEncoder().encode("data: " + JSON.stringify({ candidates: [{ finishReason: "STOP", content: { parts: [{ text: '{"columns":["a"],"rows":[["1"]],"unsure":[]}' }] } }] }) + "\n\n"), { status: 200 });
      };
      const savedLimits = localStorage.getItem("listsnap.geminiLimits");
      localStorage.removeItem("listsnap.geminiLimits");
      await ListAI.readTable("gemini", photo, "test-key", null, { knownNames: ["ባለ 10", "ፒታ"] });
      const withNames = prompt;
      await ListAI.readTable("gemini", photo, "test-key", null, {});
      window.fetch = realFetch;
      if (savedLimits) localStorage.setItem("listsnap.geminiLimits", savedLimits);
      log(withNames.includes("usually these, in this order: ባለ 10; ፒታ.") && !prompt.includes("usually these"), "remembered names are given to the AI, and only when there are some");
    }

    // --- a table read by Claude (cells already known) ---
    a = ListParser.fromTable(
      ["ተ.ቁ", "የዳቦ አይነት", "ጠዋት የተሰራ: ያደረ", "ጠዋት የተሰራ: ምክንያት"],
      [["1", "ባለ 10", "12", ""], ["2", "ባለ 25", "፲፪", "ተቃጥሏል"]]);
    log(eq(a.columns.map((c) => `${c.name}:${c.type}:${c.role}`), ["ተ.ቁ:number:null", "የዳቦ አይነት:text:item", "ጠዋት የተሰራ: ያደረ:number:null", "ጠዋት የተሰራ: ምክንያት:text:null"])
      && eq(a.rows, [[1, "ባለ 10", 12, ""], [2, "ባለ 25", 12, "ተቃጥሏል"]]),
      "Claude table: the No. column stays numbers, bread names are the items, Ethiopic numerals become numbers", JSON.stringify(a));

    // --- excel ---
    const cols = [
      { id: "a", name: "Item", type: "text", role: "item" },
      { id: "b", name: "Qty", type: "number", role: "qty" },
      { id: "c", name: "Made", type: "check", role: "made" },
    ];
    // A sheet's cells as rows: formulas as "=…", empty cells as null, trailing empties dropped.
    const grid = (wb, name) => {
      const out = [];
      wb.getWorksheet(name).eachRow((row, r) => {
        const vals = [];
        row.eachCell({ includeEmpty: true }, (cell, c) => { vals[c - 1] = cell.formula ? "=" + cell.formula : cell.value ?? null; });
        while (vals.length && vals[vals.length - 1] == null) vals.pop();
        out[r - 1] = Array.from(vals, (v) => v ?? null);
      });
      return out;
    };
    const roundTrip = async (wb) => ListExcel.readWorkbook(await ListExcel.toArrayBuffer(wb));

    const wb2 = await roundTrip(await ListExcel.buildWorkbook("List", cols, [{ a: "Eggs", b: 12, c: true }]));
    const cols2 = [...cols, { id: "d", name: "Price", type: "number" }].map((c) => c.id === "a" ? { ...c, name: "item" } : c);
    const res = ListExcel.appendToWorkbook(wb2, "List", cols2, [{ a: "Milk", b: 2, c: false, d: 3.2 }]);
    const aoa = grid(await roundTrip(wb2), "List");
    const wantAoa = [["Item", "Qty", "Made", "Price"], ["Eggs", 12, "Yes"], ["Milk", 2, "No", 3.2]];
    log(eq(aoa, wantAoa), "append matches headers (ignoring case) and adds a new column", JSON.stringify(aoa));
    log(eq(res.newColumns, ["Price"]), "reports the new columns");
    ListExcel.appendToWorkbook(wb2, "Second list", cols, [{ a: "Tea", b: 1, c: true }]);
    log(eq(ListExcel.sheetNames(wb2), ["List", "Second list"]), "a new tab is created");

    log(ListExcel.fillDown(`SUM($A$1:A3)*'My sheet'!B2+LOG10(C3)&"A1"`, 2) === `SUM($A$1:A5)*'My sheet'!B4+LOG10(C5)&"A1"`,
      "formulas are filled down like Excel does ($ rows, sheet names, text and LOG10 left alone)");

    {
      // An existing sheet with Price, a Total sales formula, a Total row and some formatting
      const src = new ExcelJS.Workbook();
      const ws = src.addWorksheet("Daily");
      ws.addRow(["Item", "Qty", "Price", "Total sales"]);
      ws.addRow(["Bread", 10, 5, { formula: "B2*C2", result: 50 }]);
      ws.addRow(["Cake", 2, 30, { formula: "B3*C3", result: 60 }]);
      ws.addRow(["Total", null, null, { formula: "SUM(D2:D3)", result: 110 }]);
      ws.getCell("A1").fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFCCE5CC" } };
      for (const addr of ["C3", "D3"]) ws.getCell(addr).numFmt = '#,##0.00 "ብር"';
      const wbF = await roundTrip(src);
      const r = ListExcel.appendToWorkbook(wbF, "Daily",
        [{ id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" }],
        [{ i: "Bread", q: 7 }, { i: "Pie", q: 3 }]);
      const back = await roundTrip(wbF);
      const g = grid(back, "Daily");
      const want = [["Item", "Qty", "Price", "Total sales"], ["Bread", 10, 5, "=B2*C2"], ["Cake", 2, 30, "=B3*C3"],
        ["Bread", 7, 5, "=B4*C4"], ["Pie", 3, null, "=B5*C5"], ["Total", null, null, "=SUM(D2:D5)"]];
      log(eq(g, want), "new rows: formulas filled down, price from the same item, placed above the Total row", JSON.stringify(g));
      log(eq([r.aboveTotal, r.formulaColumns, r.filledColumns], [true, ["Total sales"], ["Price"]]), "reports what it did", JSON.stringify(r));
      const w = back.getWorksheet("Daily");
      log(w.getCell("C4").numFmt === '#,##0.00 "ብር"' && w.getCell("A1").fill?.fgColor?.argb === "FFCCE5CC",
        "formatting is kept, and new rows get the row above's money format", JSON.stringify({ c4: w.getCell("C4").numFmt, a1: w.getCell("A1").fill }));
    }

    {
      // A two-row header like the paper form: group headings merged across their columns
      const src = new ExcelJS.Workbook();
      const ws = src.addWorksheet("Form");
      ws.getCell("A1").value = "No"; ws.mergeCells("A1:A2");
      ws.getCell("B1").value = "Morning"; ws.mergeCells("B1:C1");
      ws.getCell("B2").value = "Made"; ws.getCell("C2").value = "Sold";
      ws.getCell("D1").value = "Price"; ws.mergeCells("D1:D2");
      ws.addRow([1, 10, 8, 5]);
      const wbH = await roundTrip(src);
      const h = ListExcel.readHeaders(wbH, "Form");
      log(eq(h.headers.map((x) => x.name), ["No", "Morning: Made", "Morning: Sold", "Price"]) && h.headerRow === 2,
        "two-row header: columns are named like Morning: Made", JSON.stringify(h));
      const r = ListExcel.appendToWorkbook(wbH, "Form",
        [{ id: "n", name: "No", type: "number" }, { id: "m", name: "Morning : made", type: "number" }, { id: "s", name: "Morning: Sold", type: "number" }],
        [{ n: 2, m: 12, s: 9 }]);
      const g = grid(await roundTrip(wbH), "Form");
      log(r.newColumns.length === 0 && eq(g[3], [2, 12, 9]), "two-row header: values go under the right columns, no extra columns", JSON.stringify({ r, row4: g[3] }));
    }

    {
      // An equation column in a new file
      const cols = [
        { id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" }, { id: "p", name: "Price", type: "text" },
        { id: "t", name: "Total sales", type: "calc", equation: "[Qty] × [Price]" }, { id: "u", name: "Per item", type: "calc", equation: "[Total sales] ÷ [Qty]" },
      ];
      const wbN = await roundTrip(await ListExcel.buildWorkbook("List", cols, [{ i: "Bread", q: 3, p: "5" }]));
      const gN = grid(wbN, "List");
      const wsN = wbN.getWorksheet("List");
      log(eq(gN[1], ["Bread", 3, 5, "=B2*C2", '=IFERROR(D2/B2,"")']) && wsN.getCell("D2").value.result === 15,
        "equation in a new file: real formulas with the value, numbers saved as numbers", JSON.stringify({ row: gN[1], result: wsN.getCell("D2").value }));

      // Added to an existing file: a column new to the sheet, with data rows and a Total row
      const src = new ExcelJS.Workbook();
      const ws = src.addWorksheet("Daily");
      ws.addRow(["Item", "Qty", "Price", "Tax"]);
      ws.addRow(["Bread", 10, 5, 1]);
      ws.addRow(["Cake", 2, 30, 2]);
      ws.addRow(["Total", null, null, { formula: "SUM(D2:D3)", result: 3 }]);
      ws.getCell("D4").font = { bold: true };
      const wbE = await roundTrip(src);
      const r = ListExcel.appendToWorkbook(wbE, "Daily",
        [{ id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" }, { id: "p", name: "Price", type: "number" }, { id: "t", name: "Sales", type: "calc", equation: "[Qty] × [Price]" }],
        [{ i: "Pie", q: 4, p: 7 }]);
      const back = await roundTrip(wbE);
      const g = grid(back, "Daily");
      log(eq(g, [["Item", "Qty", "Price", "Tax", "Sales"], ["Bread", 10, 5, 1, "=B2*C2"], ["Cake", 2, 30, 2, "=B3*C3"], ["Pie", 4, 7, "=D2", "=B4*C4"], ["Total", null, null, "=SUM(D2:D4)", "=SUM(E2:E4)"]].map((row, i) => (i === 3 ? g[3] : row)))
        && g[3][4] === "=B4*C4" && eq(r.newColumns, ["Sales"]) && back.getWorksheet("Daily").getCell("E5").font?.bold === true,
        "equation in an existing file: new column worked out for old and new rows, with a SUM in the Total row", JSON.stringify({ g, r }));

      // A Price column added by hand and left empty: filled from that item's earlier row, so the equation works
      const pr = new ExcelJS.Workbook();
      const pw = pr.addWorksheet("Daily");
      pw.addRow(["Item", "Qty", "Price"]);
      pw.addRow(["Bread", 10, 5]);
      const wbP = await roundTrip(pr);
      const rp = ListExcel.appendToWorkbook(wbP, "Daily",
        [{ id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" }, { id: "p", name: "Price", type: "number", manual: true }, { id: "t", name: "Sales", type: "calc", equation: "[Qty] × [Price]" }],
        [{ i: "Bread", q: 4, p: "" }]);
      const gP = grid(await roundTrip(wbP), "Daily");
      log(eq(gP[2], ["Bread", 4, 5, "=B3*C3"]) && eq(rp.filledColumns, ["Price"]), "an empty Price added by hand is filled from the same item's earlier row", JSON.stringify({ gP, rp }));

      // A price list in Excel: a new file gets the numbers; an existing sheet without a Price column gets one,
      // filled for its old rows too, and Sales uses it
      const plCols = [{ id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" },
        { id: "p", name: "Price", type: "lookup", manual: true, priceList: "Bread = 5\nCake = 30" }, { id: "t", name: "Sales", type: "calc", manual: true, equation: "[Qty] × [Price]" }];
      const gL = grid(await roundTrip(await ListExcel.buildWorkbook("List", plCols, [{ i: "Bread", q: 3 }, { i: "Pie", q: 1 }])), "List");
      log(eq(gL.slice(1), [["Bread", 3, 5, "=B2*C2"], ["Pie", 1, null, "=B3*C3"]]), "price list in a new file: prices saved as numbers, none where there's no match", JSON.stringify(gL));
      const ex = new ExcelJS.Workbook();
      const exs = ex.addWorksheet("Daily");
      exs.addRow(["Item", "Qty"]); exs.addRow(["Cake", 2]); exs.addRow(["Bread", 10]);
      const wbL = await roundTrip(ex);
      const rl = ListExcel.appendToWorkbook(wbL, "Daily", plCols, [{ i: "Bread", q: 4 }]);
      const gE = grid(await roundTrip(wbL), "Daily");
      log(eq(gE, [["Item", "Qty", "Price", "Sales"], ["Cake", 2, 30, "=B2*C2"], ["Bread", 10, 5, "=B3*C3"], ["Bread", 4, 5, "=B4*C4"]]) && eq(rl.newColumns, ["Price", "Sales"]),
        "price list in an existing file: a new Price column is filled for old rows too", JSON.stringify({ gE, rl }));

      // The sheet already calculates that column itself: its own formula wins
      const own = new ExcelJS.Workbook();
      const ow = own.addWorksheet("Daily");
      ow.addRow(["Item", "Qty", "Price", "Sales"]);
      ow.addRow(["Bread", 10, 5, { formula: "B2*C2*2", result: 100 }]);
      const wbO = await roundTrip(own);
      ListExcel.appendToWorkbook(wbO, "Daily",
        [{ id: "i", name: "Item", type: "text", role: "item" }, { id: "q", name: "Qty", type: "number" }, { id: "p", name: "Price", type: "number" }, { id: "t", name: "Sales", type: "calc", equation: "[Qty] × [Price]" }],
        [{ i: "Pie", q: 4, p: 7 }]);
      log(grid(await roundTrip(wbO), "Daily")[2][3] === "=B3*C3*2", "equation in an existing file: a formula the sheet already has wins");
    }

    const csv = await ListExcel.readWorkbook(new TextEncoder().encode("Item,Qty\nEggs,12\n").buffer);
    log(eq(grid(csv, ListExcel.sheetNames(csv)[0]), [["Item", "Qty"], ["Eggs", 12]]), "a .csv file opens too");

    // --- OCR on samples ---
    for (const name of ["printed-list.png", "phone-photo-list.jpg"]) {
      try {
        const blob = await (await fetch("samples/" + name)).blob();
        const file = new File([blob], name, { type: blob.type });
        const t0 = performance.now();
        const { text } = await ListOCR.readImage(file, "eng");
        const rows = ListParser.parseListText(text);
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        const items = rows.map((r) => r.item.toLowerCase());
        const expected = ["bread loaves", "croissants", "muffins", "cookies", "banana cake", "milk (l)"];
        const found = expected.filter((e) => items.includes(e));
        log(found.length >= 5, `OCR ${name}: ${found.length}/6 items (${secs}s)`, JSON.stringify(rows));
        results.push({ ocrText: text });
      } catch (e) {
        log(false, `OCR ${name}`, String(e));
      }
    }

    for (const name of ["amharic-list.png", "amharic-phone-photo.jpg"]) {
      try {
        const blob = await (await fetch("samples/" + name)).blob();
        const t0 = performance.now();
        const { text } = await ListOCR.readImage(new File([blob], name, { type: blob.type }), "amh");
        const rows = ListParser.parseListText(text);
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        const want = [["ዳቦ", 12, 30], ["እንቁላል", 24, 8], ["ሻይ ቅጠል (ኪሎ)", 2, 150], ["ቡና (ኪሎ)", 5, 600], ["ስኳር (ኪሎ)", 3, 95]];
        const exact = want.filter(([i, q, p]) => rows.some((r) => r.item === i && r.qty === q && r.price === p));
        log(exact.length >= 4, `Amharic OCR ${name}: ${exact.length}/5 rows exactly right (${secs}s)`, JSON.stringify(rows));
        results.push({ ocrText: text });
      } catch (e) {
        log(false, `Amharic OCR ${name}`, String(e));
      }
    }

    // --- picture tables: columns from the header row, using real word positions ---
    for (const [name, lang, wantCols, wantFirst] of [
      ["table-with-header.jpg", "eng", ["Product", "Unit", "Qty", "Price", "Supplier"], ["Flour", "kg", 25, 40, "Abebe"]],
      ["amharic-table.png", "amh", ["ዕቃ", "ብዛት", "ዋጋ", "ደንበኛ"], ["ዳቦ", 12, 30, "ሰላም"]],
    ]) {
      try {
        const blob = await (await fetch("samples/" + name)).blob();
        const { text, lines } = await ListOCR.readImage(new File([blob], name, { type: blob.type }), lang);
        const r = ListParser.analyze(text, lines);
        const names = r.columns.map((c) => c.name);
        log(eq(names, wantCols) && eq(r.rows[0], wantFirst), `picture table ${name}: columns + first row`, JSON.stringify({ cols: r.columns, rows: r.rows, positions: lines.length }));
      } catch (e) {
        log(false, `picture table ${name}`, String(e));
      }
    }

    // --- spreadsheet screenshot: small text, wrapped cells, A B C letters and row numbers ---
    try {
      const blob = await (await fetch("samples/spreadsheet-wrapped.png")).blob();
      const t0 = performance.now();
      const { text, lines, grid } = await ListOCR.readImage(new File([blob], "spreadsheet-wrapped.png", { type: blob.type }), "eng");
      const r = ListParser.analyze(text, lines, grid);
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      const names = r.columns.map((c) => c.name.toLowerCase());
      const ok = eq(names, ["(action item)", "owner", "start date", "finish date", "status"])
        && r.rows.length === 6
        && /^Phase 1/.test(r.rows[0][0])
        && eq(r.rows[1].slice(1), ["Self", "2025-11-09", "2025-11-10", "Not Started"])
        && eq(r.rows[5].slice(1), ["Self", "2025-11-21", "2025-11-22", "In Progress"]);
      log(ok, `spreadsheet screenshot: 5 columns, 6 rows (${secs}s)`, JSON.stringify({ cols: r.columns, rows: r.rows }));
    } catch (e) {
      log(false, "spreadsheet screenshot", String(e));
    }

    const summary = { passed: results.filter((r) => r.ok === true).length, failed: results.filter((r) => r.ok === false).length, results };
    document.getElementById("out").textContent = JSON.stringify(summary, null, 2);
    document.title = summary.failed ? "ListSnap Tests: FAIL" : "ListSnap Tests: PASS";
    try { await fetch("/__result", { method: "POST", body: JSON.stringify(summary) }); } catch (_) {}
  })();
  </script>
</body>
</html>
